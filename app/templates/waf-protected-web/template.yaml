id: waf-protected-web
name: "WAF-Protected Web Tier"
version: 0.1.0
pci: capable
tier: enterprise
summary: "Auto-scaling web tier behind an ALB, fronted by a WAFv2 web ACL that blocks common attacks."
roles: [vpc, security_groups, alb, asg, waf]

variables:
  project_name:
    type: string
    required: true
    example: "shop-web"
    guidance:
      what: "Short slug used to name and tag all resources."
      how_to_get: "Pick a lowercase name, e.g. 'shop-web'."

  aws_region:
    type: string
    required: true
    example: "ap-south-1"
    guidance:
      what: "AWS region to deploy into."
      how_to_get: "Mumbai = ap-south-1, Singapore = ap-southeast-1."

  vpc_cidr:
    type: cidr
    required: true
    default: "10.70.0.0/16"
    guidance:
      what: "Network range for the VPC."
      how_to_get: "Any /16 that does not overlap your other networks."

  instance_type:
    type: string
    required: true
    default: "t3.small"
    guidance:
      what: "EC2 size for the web instances."
      how_to_get: "t3.small is a reasonable starting point."

diagram:
  nodes:
    - { id: waf, type: waf, label: "WAFv2 web ACL" }
    - { id: vpc, type: vpc, label: "VPC" }
    - { id: igw, type: igw, label: "Internet gateway" }
    - { id: pub_a, type: subnet, label: "Public subnet A" }
    - { id: pub_b, type: subnet, label: "Public subnet B" }
    - { id: alb_sg, type: security_group, label: "ALB SG" }
    - { id: app_sg, type: security_group, label: "App SG" }
    - { id: alb, type: alb, label: "Application LB" }
    - { id: lt, type: launch_template, label: "Launch template" }
  edges:
    - { from: vpc, to: igw, port: vpc }
    - { from: vpc, to: pub_a, port: vpc }
    - { from: vpc, to: pub_b, port: vpc }
    - { from: vpc, to: alb_sg, port: vpc }
    - { from: vpc, to: app_sg, port: vpc }
    - { from: pub_a, to: alb, port: subnets }
    - { from: pub_b, to: alb, port: subnets }
    - { from: alb_sg, to: alb, port: security_group }
    - { from: waf, to: alb }
    - { from: alb, to: lt }
