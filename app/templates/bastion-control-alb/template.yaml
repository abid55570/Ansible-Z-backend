id: bastion-control-alb
name: "Bastion + Control + ALB"
version: 0.1.0
pci: capable
summary: "Bastion to a private Ansible control host to an app fleet behind an ALB."
roles: [vpc, bastion, control_host, app_instances, alb]

variables:
  project_name:
    type: string
    required: true
    example: "acme"
    guidance:
      what: "Short slug used to name and tag all resources."
      how_to_get: "Pick a lowercase name, e.g. 'acme'."

  aws_region:
    type: string
    required: true
    example: "ap-south-1"
    guidance:
      what: "AWS region to deploy into."
      how_to_get: "Mumbai = ap-south-1, Singapore = ap-southeast-1."

  vpc_cidr:
    type: cidr
    required: true
    default: "10.20.0.0/16"
    guidance:
      what: "Top-level network range for the VPC."
      how_to_get: "Use a /16 that does not overlap any peered network."

  office_ip:
    type: cidr
    required: true
    scope: [uat, prod]
    example: "203.0.113.10/32"
    guidance:
      what: "The only public IP allowed to SSH the bastion."
      how_to_get: "Run: curl https://checkip.amazonaws.com  then append /32"
      uat_check: "ssh -i keys/bastion.pem ubuntu@<BASTION_IP> must connect only from this IP."

  app_desired_count:
    type: number
    required: false
    default: 2
    guidance:
      what: "How many app instances to run behind the ALB."
      how_to_get: "Start with 2 for HA; scale later."

diagram:
  nodes:
    - { id: vpc, type: vpc, label: "VPC" }
    - { id: pub, type: subnet, label: "Public subnet" }
    - { id: priv, type: subnet, label: "Private subnet" }
    - { id: sg, type: security_group, label: "Security groups" }
    - { id: bastion, type: ec2_instance, label: "Bastion (public)" }
    - { id: control, type: ec2_instance, label: "Ansible control (private)" }
    - { id: app, type: ec2_instance, label: "App fleet (private)" }
    - { id: alb, type: alb, label: "ALB (public)" }
  edges:
    - { from: vpc, to: pub, port: vpc }
    - { from: vpc, to: priv, port: vpc }
    - { from: vpc, to: sg, port: vpc }
    - { from: pub, to: bastion, port: subnet }
    - { from: sg, to: bastion, port: security_group }
    - { from: priv, to: control, port: subnet }
    - { from: sg, to: control, port: security_group }
    - { from: priv, to: app, port: subnet }
    - { from: sg, to: app, port: security_group }
    - { from: pub, to: alb, port: subnets }
    - { from: sg, to: alb, port: security_group }
    - { from: bastion, to: control }
    - { from: control, to: app }
    - { from: alb, to: app }
