id: hybrid-onprem-cloud
name: "Hybrid On-Prem to Cloud"
version: 0.1.0
pci: capable
summary: "Direct Connect / VPN boundary between data center and cloud, with flow logs."
roles: [vpc, vpn_gateway, dx_gateway, firewall, flow_logs]
variables:
  project_name: { type: string, required: true }
  aws_region: { type: string, required: true }
  onprem_cidr: { type: cidr, required: true, example: "192.168.0.0/16" }

diagram:
  nodes:
    - { id: onprem, type: datacenter, label: "On-prem network" }
    - { id: vgw, type: vpn_gateway, label: "VPN gateway" }
    - { id: vpc, type: vpc, label: "Cloud VPC" }
    - { id: subnet, type: subnet, label: "Private subnet" }
  edges:
    - { from: onprem, to: vgw }
    - { from: vgw, to: vpc }
    - { from: vpc, to: subnet, port: vpc }
