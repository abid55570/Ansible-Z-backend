id: ha-multi-az
name: "Multi-AZ High Availability"
version: 0.1.0
pci: none
summary: "Auto-scaling app across Availability Zones with RDS Multi-AZ failover."
roles: [vpc, security_groups, asg_app, alb, rds_multiaz]

variables:
  project_name:
    type: string
    required: true
    example: "shop"
    guidance:
      what: "Short slug used to name and tag all resources."
      how_to_get: "Pick a lowercase name, e.g. 'shop'."

  aws_region:
    type: string
    required: true
    example: "ap-south-1"
    guidance:
      what: "AWS region to deploy into (uses AZs a and b)."
      how_to_get: "Mumbai = ap-south-1, Singapore = ap-southeast-1."

  vpc_cidr:
    type: cidr
    required: true
    default: "10.0.0.0/16"
    guidance:
      what: "Top-level network range for the VPC (split across two AZs)."
      how_to_get: "Use a /16 that does not overlap any peered network."

  min_size:
    type: number
    required: false
    default: 2
    guidance:
      what: "Minimum (and desired) number of app instances in the ASG."
      how_to_get: "2 keeps one instance per AZ."

  max_size:
    type: number
    required: false
    default: 4
    guidance:
      what: "Maximum number of app instances the ASG can scale to."
      how_to_get: "Set to your peak-load capacity."
