id: ha-multi-az
name: "Multi-AZ High Availability"
version: 0.1.0
pci: none
summary: "Auto-scaling app across Availability Zones with RDS Multi-AZ failover."
roles: [vpc, security_groups, asg_app, alb, rds_multiaz]

variables:
  project_name:
    type: string
    required: true
    example: "shop"
    guidance:
      what: "Short slug used to name and tag all resources."
      how_to_get: "Pick a lowercase name, e.g. 'shop'."

  aws_region:
    type: string
    required: true
    example: "ap-south-1"
    guidance:
      what: "AWS region to deploy into (uses AZs a and b)."
      how_to_get: "Mumbai = ap-south-1, Singapore = ap-southeast-1."

  vpc_cidr:
    type: cidr
    required: true
    default: "10.0.0.0/16"
    guidance:
      what: "Top-level network range for the VPC (split across two AZs)."
      how_to_get: "Use a /16 that does not overlap any peered network."

  min_size:
    type: number
    required: false
    default: 2
    guidance:
      what: "Minimum (and desired) number of app instances in the ASG."
      how_to_get: "2 keeps one instance per AZ."

  max_size:
    type: number
    required: false
    default: 4
    guidance:
      what: "Maximum number of app instances the ASG can scale to."
      how_to_get: "Set to your peak-load capacity."

diagram:
  nodes:
    - { id: vpc, type: vpc, label: "VPC (2 AZs)" }
    - { id: pubA, type: subnet, label: "Public A" }
    - { id: pubB, type: subnet, label: "Public B" }
    - { id: privA, type: subnet, label: "Private A" }
    - { id: privB, type: subnet, label: "Private B" }
    - { id: sg, type: security_group, label: "Security groups" }
    - { id: alb, type: alb, label: "ALB (multi-AZ)" }
    - { id: app, type: ec2_instance, label: "App ASG" }
    - { id: db, type: rds, label: "RDS Multi-AZ" }
  edges:
    - { from: vpc, to: pubA, port: vpc }
    - { from: vpc, to: pubB, port: vpc }
    - { from: vpc, to: privA, port: vpc }
    - { from: vpc, to: privB, port: vpc }
    - { from: vpc, to: sg, port: vpc }
    - { from: pubA, to: alb, port: subnets }
    - { from: pubB, to: alb, port: subnets }
    - { from: sg, to: alb, port: security_group }
    - { from: privA, to: app, port: subnet }
    - { from: sg, to: app, port: security_group }
    - { from: privA, to: db, port: subnets }
    - { from: privB, to: db, port: subnets }
    - { from: alb, to: app }
