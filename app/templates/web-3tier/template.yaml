id: web-3tier
name: "Secure 3-Tier Web App (VPC + ALB + App + RDS)"
version: 0.1.0
pci: capable
summary: "Public ALB -> private app tier -> private DB, with bastion/SSM admin access."
roles: [vpc, security_groups, bastion, alb, asg_app, rds]

variables:
  project_name:
    type: string
    required: true
    example: "acme-web"
    guidance:
      what: "Short slug used to name and tag all resources."
      how_to_get: "Pick a lowercase name, e.g. 'acme-web'."

  aws_region:
    type: string
    required: true
    example: "ap-south-1"
    guidance:
      what: "AWS region to deploy into."
      how_to_get: "Mumbai = ap-south-1, Singapore = ap-southeast-1."

  vpc_cidr:
    type: cidr
    required: true
    default: "10.20.0.0/16"
    guidance:
      what: "Top-level network range for the VPC."
      how_to_get: "Use a /16 that does not overlap any peered network."

  office_ip:
    type: cidr
    required: true
    scope: [uat, prod]
    example: "203.0.113.10/32"
    guidance:
      what: "The only public IP allowed to SSH the bastion."
      how_to_get: "Run: curl https://checkip.amazonaws.com  then append /32"
      uat_check: "ssh -i keys/bastion.pem ubuntu@<BASTION_IP> must connect only from this IP."

  certificate_arn:
    type: string
    required: false
    scope: [uat, prod]
    guidance:
      what: "ACM certificate ARN for the ALB HTTPS:443 listener."
      how_to_get: "AWS Console -> Certificate Manager (same region) -> request -> copy ARN."

diagram:
  nodes:
    - { id: vpc, type: vpc, label: "VPC 10.20.0.0/16" }
    - { id: pub, type: subnet, label: "Public subnet" }
    - { id: priv, type: subnet, label: "Private subnet" }
    - { id: sg, type: security_group, label: "Security groups" }
    - { id: bastion, type: ec2_instance, label: "Bastion (public)" }
    - { id: alb, type: alb, label: "ALB (public)" }
    - { id: app, type: ec2_instance, label: "App tier (private)" }
    - { id: db, type: rds, label: "RDS (private)" }
  edges:
    - { from: vpc, to: pub, port: vpc }
    - { from: vpc, to: priv, port: vpc }
    - { from: vpc, to: sg, port: vpc }
    - { from: pub, to: bastion, port: subnet }
    - { from: sg, to: bastion, port: security_group }
    - { from: pub, to: alb, port: subnets }
    - { from: sg, to: alb, port: security_group }
    - { from: priv, to: app, port: subnet }
    - { from: sg, to: app, port: security_group }
    - { from: priv, to: db, port: subnets }
    - { from: alb, to: app }

key_points:
  - "The public ALB is the only internet-facing resource."
  - "App tier and database live in private subnets."
  - "Admin access is via the bastion (or SSM) from the office IP only."
  - "DB credentials belong in ansible-vault, never in plain group_vars."

security_groups:
  - name: "ALB SG"
    inbound: ["HTTPS 443 / HTTP 80 from the Internet"]
    outbound: ["App port to App SG"]
  - name: "App SG"
    inbound: ["App port from ALB SG only"]
    outbound: ["DB port to RDS SG"]
  - name: "Bastion SG"
    inbound: ["SSH 22 from the office IP only"]
    outbound: ["SSH to the private subnets"]
  - name: "RDS SG"
    inbound: ["DB port from App SG only"]
    outbound: ["None"]
