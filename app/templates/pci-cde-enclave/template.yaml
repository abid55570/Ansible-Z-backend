id: pci-cde-enclave
name: "PCI CDE Enclave"
version: 0.1.0
pci: core
summary: "Isolated cardholder-data environment with vault, FIM, AV and centralized logging."
roles: [vpc_isolated, nacl, vault_tokenize, fim, antivirus, logging, kms]
variables:
  project_name: { type: string, required: true }
  aws_region: { type: string, required: true }
  cde_cidr: { type: cidr, required: true, default: "10.50.0.0/24" }
  office_ip: { type: cidr, required: true, scope: [uat, prod] }

diagram:
  nodes:
    - { id: vpc, type: vpc, label: "Isolated VPC (no IGW)" }
    - { id: subnet, type: subnet, label: "Private CDE subnet" }
    - { id: sg, type: security_group, label: "Restricted SG" }
    - { id: kms, type: kms_key, label: "KMS key" }
    - { id: logs, type: s3_bucket, label: "Encrypted logs" }
    - { id: trail, type: cloudtrail, label: "CloudTrail" }
  edges:
    - { from: vpc, to: subnet, port: vpc }
    - { from: vpc, to: sg, port: vpc }
    - { from: kms, to: logs }
    - { from: logs, to: trail }

key_points:
  - "Isolated cardholder-data environment — no internet gateway."
  - "All data encrypted with KMS; every API call logged via CloudTrail."
  - "Admin access restricted to the office IP allow-list (UAT/PROD)."
  - "Vault tokenisation, FIM, AV and centralised logging satisfy PCI controls."

security_groups:
  - name: "Restricted CDE SG"
    inbound: ["Only the office IP, on required ports"]
    outbound: ["Only to in-scope CDE services"]
