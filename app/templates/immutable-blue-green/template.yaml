id: immutable-blue-green
name: "Immutable Blue/Green"
version: 0.1.0
pci: capable
summary: "Golden-AMI pipeline with zero-downtime blue/green deployments."
roles: [vpc, golden_ami, asg_blue_green, alb, pipeline]
variables:
  project_name: { type: string, required: true }
  aws_region: { type: string, required: true }
  base_ami: { type: string, required: false }

diagram:
  nodes:
    - { id: vpc, type: vpc, label: "VPC" }
    - { id: pub_a, type: subnet, label: "Public subnet A" }
    - { id: pub_b, type: subnet, label: "Public subnet B" }
    - { id: sg, type: security_group, label: "ALB SG" }
    - { id: lt, type: launch_template, label: "Golden AMI LT" }
    - { id: blue, type: target_group, label: "Blue TG" }
    - { id: green, type: target_group, label: "Green TG" }
    - { id: alb, type: alb, label: "ALB" }
  edges:
    - { from: vpc, to: pub_a, port: vpc }
    - { from: vpc, to: pub_b, port: vpc }
    - { from: vpc, to: sg, port: vpc }
    - { from: vpc, to: blue, port: vpc }
    - { from: vpc, to: green, port: vpc }
    - { from: pub_a, to: alb, port: subnets }
    - { from: pub_b, to: alb, port: subnets }
    - { from: sg, to: alb, port: security_group }
    - { from: alb, to: blue }
    - { from: alb, to: green }
    - { from: lt, to: blue }
