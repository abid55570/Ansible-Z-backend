id: serverless-eventdriven
name: "Serverless Event-Driven"
version: 0.1.0
pci: scope-reducer
summary: "API Gateway + Lambda + managed data, minimal audit surface."
roles: [api_gateway, lambda, dynamodb, eventbridge, waf]
variables:
  project_name: { type: string, required: true }
  aws_region: { type: string, required: true }
  runtime: { type: string, required: false, default: "python3.12" }

diagram:
  nodes:
    - { id: api, type: api_gateway, label: "API Gateway" }
    - { id: lambda, type: lambda, label: "Lambda" }
    - { id: ddb, type: dynamodb, label: "DynamoDB" }
    - { id: events, type: eventbridge, label: "EventBridge" }
  edges:
    - { from: api, to: lambda }
    - { from: lambda, to: ddb }
    - { from: events, to: lambda }
