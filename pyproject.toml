[project]
name = "neviri-ansi-backend"
version = "0.1.0"
description = "Neviri-Ansi API + project generator"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=93"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["app/templates/*", "tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
