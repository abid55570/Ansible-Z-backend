name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install ansible-core (enables the real --syntax-check template gate on Linux)
        run: pip install "ansible-core>=2.16"
      - name: Run tests (93% coverage gate enforced via pyproject)
        run: pytest

