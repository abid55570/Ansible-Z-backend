# Local dev dependencies: Postgres + MinIO (S3-compatible). `docker compose up -d`
# Add the API too with the "full" profile: `docker compose --profile full up --build`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ansiblez
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ansiblez"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: ["full"]
    env_file: .env
    environment:
      # Override .env to use the bundled Postgres; migrations run on start.
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/ansiblez
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
